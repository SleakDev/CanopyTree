<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebeae6" />
    <title>Arbor — Procedural Tree Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23364825'/%3E%3Cpath d='M32 50V28m0 0c-12 0-17-8-17-16 11 0 17 6 17 16Zm0 7c11 0 17-7 17-15-10 0-17 6-17 15Z' fill='none' stroke='%23c6e98a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport" aria-label="Procedural tree preview">
        <div class="loading-veil" id="loading-veil" aria-hidden="true">
          <div class="loading-card" role="status" aria-live="polite">
            <span class="loading-wheel" aria-hidden="true"></span>
            <span class="loading-label" id="loading-label">Growing leaves…</span>
          </div>
        </div>
      </div>

      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M16 27V14.5m0 0c-6.5 0-9.5-4.4-9.5-9.2C12.8 5.3 16 8.3 16 14.5Zm0 3.2c6.1 0 9.4-3.8 9.4-8.3-5.6 0-9.4 3.3-9.4 8.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-name">Arbor</span>
          <span class="brand-tag">tree studio</span>
        </div>

        <div class="seed-control" aria-label="Tree seed">
          <button class="icon-button seed-dice" id="seed-dice" type="button" title="New seed (S)" aria-label="Generate a new seed">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="4.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="9" cy="9" r="1.2" fill="currentColor"/>
              <circle cx="15" cy="15" r="1.2" fill="currentColor"/>
              <circle cx="15" cy="9" r="1.2" fill="currentColor"/>
              <circle cx="9" cy="15" r="1.2" fill="currentColor"/>
            </svg>
          </button>
          <label class="seed-field">
            <span class="seed-label">seed</span>
            <input id="seed-input" type="text" spellcheck="false" autocomplete="off" aria-label="Edit tree seed" />
          </label>
          <button class="icon-button" id="seed-again" type="button" title="Regenerate this seed (R)" aria-label="Regenerate tree">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M19 8.5A8 8 0 1 0 19.4 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M19.5 4v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="top-actions">
          <button class="soft-button hide-small" id="share-button" type="button" title="Copy a share link">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="18" cy="5.5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="6" cy="12" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="18" cy="18.5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <path d="m8 10.9 7.8-4.2M8 13.1l7.8 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span>Share</span>
          </button>
          <button class="icon-button" id="theme-button" type="button" title="Toggle theme" aria-label="Toggle interface theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-button" id="help-button" type="button" title="Help and shortcuts" aria-label="Help">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M9.8 9.3a2.35 2.35 0 1 1 3.6 2c-.9.55-1.4 1-1.4 2.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="12" cy="16.8" r="1" fill="currentColor"/>
            </svg>
          </button>
          <button class="primary-button" id="export-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.8v10.4m0 0 4-4m-4 4-4-4M5 16.5v2.2A1.8 1.8 0 0 0 6.8 20.5h10.4a1.8 1.8 0 0 0 1.8-1.8v-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Export</span>
          </button>
        </div>
      </header>

      <aside class="panel" id="panel" aria-label="Tree controls">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Customize</p>
            <h2 id="panel-title">The look</h2>
          </div>
          <div class="panel-head-actions">
            <button class="icon-button" id="panel-reset" type="button" title="Reset to the selected look" aria-label="Reset controls">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5.2 10.4A7.2 7.2 0 1 1 6 15.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M4.6 6.6v4.2h4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="icon-button panel-close" id="panel-close" type="button" title="Collapse controls" aria-label="Collapse controls">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m6.5 6.5 11 11m0-11-11 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="panel-scroll" id="panel-scroll">
          <section class="view-controls" aria-label="Visualization settings">
            <div class="section-label-row">
              <span class="section-label">View</span>
              <span class="section-note">Preview only</span>
            </div>
            <div class="view-toggles">
              <button class="view-toggle" id="hide-leaves" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 20V11m0 0C7.2 11 5 8 5 4.8 9.4 4.8 12 7 12 11Zm0 2.8c4 0 6.2-2.5 6.2-5.5-3.7 0-6.2 2.2-6.2 5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Hide leaves</span>
              </button>
              <button class="view-toggle" id="hide-branches" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 21V8m0 4-5-3m5 3 5-3m-5-1V4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="7" cy="4.6" r="1.6" stroke="currentColor" stroke-width="1.4"/>
                  <circle cx="17" cy="4.6" r="1.6" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                <span>Hide branches</span>
              </button>
            </div>
            <div class="segmented view-modes" id="view-modes" role="group" aria-label="Shading style">
              <button type="button" data-shading="natural" class="is-active">Natural</button>
              <button type="button" data-shading="gray">Gray</button>
              <button type="button" data-shading="wire">Wireframe</button>
            </div>
          </section>

          <section class="quick-controls" aria-label="Quick shape controls">
            <div class="section-label-row">
              <span class="section-label">Shape</span>
              <span class="section-note">Live</span>
            </div>
            <div id="quick-controls"></div>
          </section>

          <button class="advanced-toggle" id="advanced-toggle" type="button" aria-expanded="false">
            <span class="advanced-title">
              <span class="advanced-dot" aria-hidden="true"></span>
              Advanced controls
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="advanced-body" id="advanced-body" hidden>
            <div class="tabs" id="param-tabs" role="tablist" aria-label="Parameter groups"></div>
            <div class="tab-panel" id="param-panel" role="tabpanel"></div>
          </div>
        </div>

        <div class="panel-foot">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="tree-stats">Growing leaves…</span>
          <span class="foot-sep" aria-hidden="true"></span>
          <span id="tree-time"></span>
        </div>
      </aside>

      <section class="looks" id="looks" aria-label="Tree presets">
        <div class="looks-head">
          <span class="section-label">Looks</span>
          <span class="looks-note">Start from a silhouette</span>
          <div class="looks-tools">
            <button class="looks-tool" id="save-preset-button" type="button" title="Save the current look">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6.5 4.5h8a2 2 0 0 1 2 2v13l-6-3.4-6 3.4v-13a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M11 7.8v4.4M8.8 10h4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <span>Save</span>
            </button>
            <button class="looks-tool" id="import-preset-button" type="button" title="Import presets from a JSON file">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3.8v9.4m0 0-3.5-3.5m3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 15.8v2.4a1.4 1.4 0 0 0 1.4 1.4h11.2a1.4 1.4 0 0 0 1.4-1.4v-2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <span>Import</span>
            </button>
            <button class="looks-tool looks-collapse" id="looks-collapse" type="button" title="Collapse looks" aria-label="Collapse looks" aria-expanded="true">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="preset-rail" id="preset-rail" role="list"></div>
        <input id="preset-file-input" type="file" accept="application/json,.json" hidden />
      </section>

      <div class="hint" id="hint">
        <span>Drag to orbit</span>
        <span class="hint-dot"></span>
        <span>Right-drag to pan</span>
        <span class="hint-dot"></span>
        <span>Scroll to zoom</span>
        <span class="hint-dot"></span>
        <span>Click the leaves</span>
      </div>

      <button class="tune-fab" id="tune-fab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h9m4 0h3M4 17h4m4 0h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="15" cy="7" r="2.2" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="10" cy="17" r="2.2" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Tune</span>
      </button>

      <div class="mobile-scrim" id="mobile-scrim"></div>
      <button class="ui-reveal" id="ui-reveal" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 12s3.1-5.6 8.5-5.6S20.5 12 20.5 12s-3.1 5.6-8.5 5.6S3.5 12 3.5 12Z" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span>Show interface</span>
      </button>

      <div id="modal-root"></div>
      <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
